#            name: <what to call it in the email>
#            topic: semis | geopolitics | finance
#
# To add a source: find its RSS link (usually sitename.com/feed or /rss)
# and copy the pattern below. To remove one, delete its 3 lines.

feeds:

  # ---------- SEMICONDUCTORS ----------
